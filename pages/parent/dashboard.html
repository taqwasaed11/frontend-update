<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مستكشف القدرات | لوحة القيادة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../../css/ParentDashboard.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon"><i data-lucide="brain-circuit"></i></div>
          <div class="brand-text">مستكشف<span>القدرات</span></div>
        </div><div class="profile">
          <div class="avatar">b</div>
          <div class="profile-info">
            <div class="profile-name" id="sidebarUserName">جاري التحميل...</div>
            <div class="profile-role">
              <span class="status-dot"></span> ولي أمر
            </div>
          </div>
        </div>

        <div class="menu-title">القائمة الرئيسية</div>
        <nav class="nav">
          <a href="./dashboard.html" class="nav-item active"
            ><i data-lucide="layout-dashboard"></i><span>لوحة القيادة</span></a
          >
          <a href="./children.html" class="nav-item"
            ><i data-lucide="users-round"></i><span>الأطفال</span></a
          >
          <a href="./tests.html" class="nav-item"
            ><i data-lucide="brain"></i><span>الاختبارات</span></a
          >
          <a href="./games.html" class="nav-item"
            ><i data-lucide="gamepad-2"></i><span>الألعاب</span></a
          >
          <a href="./reports.html" class="nav-item"
            ><i data-lucide="file-chart-column"></i><span>التقارير</span></a
          >
          <a href="./Messages.html" class="nav-item"
            ><i data-lucide="message-circle"></i><span>الرسائل</span></a
          >
        </nav>

        <div class="logout">
          <a href="../../index.html" class="nav-item"
            ><i data-lucide="log-out"></i><span>تسجيل الخروج</span></a
          >
        </div>
      </aside>

      <main class="main" id="dashboard">
        <section class="welcome">
          <div class="welcome-content">
            <div class="date-pill">
              <span>⚡</span>
              <span id="dashboardDate"></span>
            </div>
            <h1>
              مساء النور
              <span id="userFullName">جاري التحميل...</span>
            </h1>
            <p>إليك نظرة عامة على آخر التطورات والأنشطة.</p></div>
        </section>

        <section class="stats" id="children">
          <div class="stat">
            <div class="stat-icon blue"><i data-lucide="users-round"></i></div>
            <div>
              <div class="stat-label">الأبناء</div>
              <div class="stat-value" id="childrenCount">0</div>
            </div>
          </div>

          <div class="stat">
            <div class="stat-icon green">
              <i data-lucide="circle-check"></i>
            </div>
            <div>
              <div class="stat-label">الأنشطة المكتملة</div>
              <div class="stat-value">0</div>
            </div>
          </div>

          <div class="stat">
            <div class="stat-icon blue">
              <i data-lucide="chart-no-axes-combined"></i>
            </div>
            <div>
              <div class="stat-label">معدل التقدم العام</div>
              <div class="stat-value">85%</div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../../js/ParentDashboard.js"></script>
  </body>
</html>
