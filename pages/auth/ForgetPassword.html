<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>مستكشف القدرات | نسيت كلمة المرور</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/forgot-password.css" />
  </head>

  <body>
    <div class="page-container">
      <a href="./login.html" class="back-link">
        <i class="fa-solid fa-arrow-right"></i>
        العودة لتسجيل الدخول
      </a>

      <div class="forgot-card">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-brain"></i>
          </div>

          <div class="brand-name">مستكشف القدرات</div>
        </div>

        <div class="main-icon">
          <i class="fa-solid fa-lock"></i>
        </div>

        <div class="welcome">
          <h1>نسيت كلمة المرور؟</h1>

          <p>لا تقلق، سنساعدك على استعادة حسابك بسهولة</p>
        </div>

        <form id="forgotPasswordForm">
          <div class="form-group">
            <label for="email"> البريد الإلكتروني </label>

            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>

              <input
                type="email"
                id="email"
                placeholder="name@example.com"
                autocomplete="off"
                required
              />
            </div>

            <div class="error-message" id="emailError"></div>
          </div>

          <button type="submit" class="submit-button" id="submitButton">
            <span id="buttonText"> إرسال كود التحقق </span>

            <i class="fa-solid fa-paper-plane"></i>

            <span class="spinner" id="spinner"> </span>
          </button>

          <div class="api-message" id="apiMessage"></div>
        </form>

        <div class="bottom-text">
          تذكرت كلمة المرور؟

          <a href="./login.html"> تسجيل الدخول </a>
        </div>
        <div class="bottom-text">
          تعرف كلمة المرور؟
          <a href="./ChangePassword.html"> غيرها من هنا</a>
        </div>
      </div>
    </div>

    <script src="../../js/forgot-password.js"></script>
  </body>
</html>
