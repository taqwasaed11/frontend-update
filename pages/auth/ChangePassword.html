<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>مستكشف القدرات | تغيير كلمة المرور</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/ChangePassword.css" />
  </head>

  <body>
    <div class="page-container">
      <a href="./login.html" class="back-link">
        <i class="fa-solid fa-arrow-right"></i>

        العودة لتسجيل الدخول
      </a>

      <div class="change-card">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-brain"></i>
          </div>

          <div class="brand-name">مستكشف القدرات</div>
        </div>
        <div class="welcome">
          <div class="title-icon">
            <i class="fa-solid fa-key"></i>
          </div>

          <h1>تغيير كلمة المرور</h1>

          <p>أدخل كلمة المرور الحالية ثم اختر كلمة مرور جديدة لحسابك</p>
        </div>
        <form id="changePasswordForm">
          <div class="form-group">
            <label for="currentPassword"> كلمة المرور الحالية </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="currentPassword"
                placeholder="أدخل كلمة المرور الحالية"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="toggleCurrentPassword"
                aria-label="إظهار كلمة المرور"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="newPassword"> كلمة المرور الجديدة </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="newPassword"
                placeholder="أدخل كلمة المرور الجديدة"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="toggleNewPassword"
                aria-label="إظهار كلمة المرور"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="password-rules">
              <div class="rule" id="ruleLength">
                <i class="fa-solid fa-circle"></i>
                8 أحرف على الأقل
              </div>

              <div class="rule" id="ruleUpper">
                <i class="fa-solid fa-circle"></i>
                حرف كبير (A-Z)
              </div>

              <div class="rule" id="ruleLower">
                <i class="fa-solid fa-circle"></i>
                حرف صغير (a-z)
              </div>

              <div class="rule" id="ruleNumber">
                <i class="fa-solid fa-circle"></i>
                رقم (0-9)
              </div>

              <div class="rule" id="ruleSpecial">
                <i class="fa-solid fa-circle"></i>
                رمز خاص (!@#$%)
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmPassword"> تأكيد كلمة المرور الجديدة </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-shield-halved input-icon"></i>

              <input
                type="password"
                id="confirmPassword"
                placeholder="أعد إدخال كلمة المرور الجديدة"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="toggleConfirmPassword"
                aria-label="إظهار كلمة المرور"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>

            <div class="validation-message" id="confirmError">
              كلمتا المرور غير متطابقتين
            </div>
          </div>
          <div class="message success-message" id="successMessage"></div>
          <div class="message error-message" id="errorMessage"></div>
          <button type="submit" class="change-button" id="changeButton">
            <span id="buttonText"> تغيير كلمة المرور </span>

            <i class="fa-solid fa-key" id="buttonIcon"></i>
          </button>
        </form>

        <div class="bottom-text">
          <i class="fa-solid fa-shield-halved"></i>

          كلمة المرور الجديدة ستستخدم لتسجيل الدخول إلى حسابك
        </div>
      </div>
    </div>

    <script src="../../js/ChangePassword.js"></script>
  </body>
</html>
