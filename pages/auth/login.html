<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مستكشف القدرات | تسجيل الدخول</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/login.css" />
  </head>

  <body>
    <div style="width: 495px; position: relative">
      <div>
        <a href="../../index.html" class="home-link"
          ><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
        </a>
      </div>
      <div class="login-card">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-brain" style="font-size: 29px"></i>
          </div>

          <div class="brand-name">مستكشف القدرات</div>
        </div>
        <div class="welcome">
          <h1>أهلًا بعودتك!</h1>
          <p>سجّل دخولك لمتابعة رحلة طفلك</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <div class="form-label-row">
              <label for="email"> البريد الإلكتروني </label>
            </div>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@example.com"
                autocomplete
                required
              />
            </div>
          </div>
          <div class="form-group">
            <div class="form-label-row">
              <label for="password"> كلمة المرور </label>
              <a
                href="./ForgetPassword.html"
                class="forgot-password"
                target="_blank"
              >
                نسيت كلمة المرور؟
              </a>
            </div>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="إظهار كلمة المرور"
              ></button>
            </div>
          </div>
          <div class="remember-row">
            <input type="checkbox" id="remember" checked />
            <label for="remember"> تذكرني على هذا الجهاز </label>
          </div>
          <button type="submit" class="login-button">
            <span>دخول</span>
            <i
              class="fa-solid fa-wand-magic-sparkles"
              style="font-size: 17px"
            ></i>
          </button>
        </form>
        <div class="register-text">
          ليس لديك حساب؟
          <a href="./registers.html"> سجّل الآن </a>
        </div>
      </div>
    </div>
    <script src="../../js/login.js"></script>
  </body>
</html>
