<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>مستكشف القدرات | تغيير كلمة المرور</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/reset-password.css" />
  </head>

  <body>
    <div class="page-container">
      <div class="reset-card">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-brain"></i>
          </div>

          <div class="brand-name">مستكشف القدرات</div>
        </div>

        <div class="main-icon">
          <i class="fa-solid fa-key"></i>
        </div>

        <div class="welcome">
          <h1>تغيير كلمة المرور</h1>

          <p>أنشئ كلمة مرور جديدة وآمنة لحسابك</p>
        </div>

        <form id="resetPasswordForm">
          <div class="form-group">
            <label for="newPassword"> كلمة المرور الجديدة </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"> </i>

              <input
                type="password"
                id="newPassword"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="إظهار كلمة المرور"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>

            <div class="strength-bar" id="strengthBar">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="rules">
              <div class="rule" data-rule="length">
                <span> 8 أحرف على الأقل </span>

                <span class="check"> ✓ </span>
              </div>

              <div class="rule" data-rule="upper">
                <span> حرف كبير (A-Z) </span>

                <span class="check"> ✓ </span>
              </div>

              <div class="rule" data-rule="lower">
                <span> حرف صغير (a-z) </span>

                <span class="check"> ✓ </span>
              </div>

              <div class="rule" data-rule="number">
                <span> رقم (0-9) </span>

                <span class="check"> ✓ </span>
              </div>

              <div class="rule" data-rule="special">
                <span> رمز خاص (!@#$%) </span>

                <span class="check"> ✓ </span>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword"> تأكيد كلمة المرور </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"> </i>

              <input
                type="password"
                id="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="toggleConfirmPassword"
                aria-label="إظهار كلمة المرور"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>

            <div class="error-message" id="confirmError"></div>
          </div>

          <button type="submit" class="submit-button" id="submitButton">
            <span id="buttonText"> تغيير كلمة المرور </span>

            <i class="fa-solid fa-check"></i>

            <span class="spinner" id="spinner"> </span>
          </button>

          <div class="api-message" id="apiMessage"></div>
        </form>

        <div class="bottom-text">
          تذكرت كلمة المرور؟

          <a href="./login.html"> تسجيل الدخول </a>
        </div>
      </div>
    </div>

    <script src="../../js/reset-password.js"></script>
  </body>
</html>
